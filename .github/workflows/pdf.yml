name: PDF erzeugen

# Baut alle PDFs neu, sobald sich die Anleitung, das Nachschlagebuch oder ihre Bilder ändern.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "Nachschlagebuch.md"
      - "display/**"
      - "m/**"
      - ".github/workflows/pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schrift installieren
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - name: PDFs erzeugen
        run: |
          python3 display/pdf.py
          python3 display/aushang.py
          python3 display/nachschlagen.py

      - name: PDFs einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Anleitung.pdf Aushang.pdf Nachschlagebuch.pdf
          git diff --cached --quiet || git commit -m "PDFs neu erzeugt"
          git push
